<svg width="800" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="500" fill="#ffffff"/>

  <!-- Main branch vertical line -->
  <line x1="100" y1="40" x2="100" y2="470" stroke="#888780" stroke-width="3" opacity="0.4"/>
  <text font-size="14" font-weight="500" fill="#2C2C2A" x="100" y="28" text-anchor="middle">main</text>

  <!-- Main commits -->
  <circle cx="100" cy="60"  r="7" fill="#888780" opacity="0.4"/>
  <circle cx="100" cy="120" r="7" fill="#888780" opacity="0.4"/>
  <!-- merge commit on main -->
  <circle cx="100" cy="420" r="9" fill="#888780" opacity="0.4"/>
  <circle cx="100" cy="470" r="7" fill="#888780" opacity="0.4"/>

  <!-- Feature branch line: branches at y=120, runs all the way to y=410 in blue, curves back into main -->
  <path d="M100 120 Q160 120 180 155 L180 410 Q180 420 100 420" fill="none" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Feature branch label -->
  <text font-size="14" font-weight="500" fill="#185FA5" x="190" y="150" text-anchor="start">feature/my-task</text>

  <!-- Feature commits — all blue -->
  <circle cx="180" cy="170" r="7" fill="#185FA5"/>
  <circle cx="180" cy="220" r="7" fill="#185FA5"/>
  <circle cx="180" cy="270" r="7" fill="#185FA5"/>

  <!-- Sync: dashed arrow from main into feature (merge main into feature) -->
  <path d="M100 310 Q140 318 172 320" fill="none" stroke="#BA7517" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <circle cx="180" cy="320" r="7" fill="#185FA5"/>

  <!-- PR box -->
  <rect x="118" y="340" width="140" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#3C3489" x="188" y="361" text-anchor="middle">Pull Request</text>

  <!-- Approval badge -->
  <rect x="128" y="382" width="120" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" fill="#085041" x="188" y="398" text-anchor="middle">Approved ✓</text>

  <!-- Step leader lines -->
  <line x1="108" y1="120" x2="310" y2="120" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="188" y1="220" x2="310" y2="220" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="188" y1="320" x2="310" y2="305" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="258" y1="357" x2="310" y2="370" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="248" y1="395" x2="310" y2="405" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="108" y1="420" x2="310" y2="435" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Step labels -->
  <text font-size="12" fill="#5F5E5A" x="315" y="116">1. Branch off from main</text>
  <text font-size="12" fill="#5F5E5A" x="315" y="216">2. Develop on feature branch</text>
  <text font-size="12" fill="#5F5E5A" x="315" y="301">3. Merge main → feature, test</text>
  <text font-size="12" fill="#5F5E5A" x="315" y="366">4. Open PR — await review</text>
  <text font-size="12" fill="#5F5E5A" x="315" y="401">5. Peer approves + CI passes</text>
  <text font-size="12" fill="#5F5E5A" x="315" y="431">6. Feature merged into main</text>

</svg>
